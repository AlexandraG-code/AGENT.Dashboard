<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENT.Dashboard</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
  --txt:#e6edf3; --dim:#8b949e; --acc:#4a9eff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f8fa;--panel:#fff;--panel2:#f0f3f6;--line:#d8dee4;--txt:#1f2328;--dim:#636c76;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:10}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
h1 span{color:var(--acc)}
.stat{display:flex;flex-direction:column;line-height:1.2}
.stat b{font-variant-numeric:tabular-nums;font-size:15px}
.stat i{font-style:normal;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.spacer{flex:1}
select,input,textarea,button{font-family:inherit;font-size:13px;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
textarea{width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical}
button{cursor:pointer;background:var(--acc);border-color:transparent;color:#fff;font-weight:500}
button:hover{filter:brightness(1.1)} button:disabled{opacity:.5;cursor:default}
button.ghost{background:var(--panel2);color:var(--txt);font-weight:400}
nav{display:flex;gap:4px;padding:10px 20px 0}
nav button{background:none;color:var(--dim);border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;font-weight:500}
nav button.on{color:var(--txt);border-bottom-color:var(--acc)}
main{padding:16px 20px 60px}
.tab{display:none} .tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:start}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list div{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.list div:last-child{border-bottom:none}
.list div:hover{background:var(--panel2)}
.list div.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
.list small{display:block;color:var(--dim);font-size:11px}
.feed{font-family:var(--mono);font-size:12px}
.row{display:grid;grid-template-columns:62px 84px 108px 1fr 92px 62px;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:baseline}
.row:hover{background:var(--panel2)}
.row .t{color:var(--dim)}
.row .task{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.row .c{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--line)}
.tag.err{color:var(--err);border-color:var(--err)}
.tag.free{color:var(--ok)}
.out{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:60vh;overflow:auto;margin-top:10px}
.meta{color:var(--dim);font-size:12px;margin:6px 0}
label{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>AGENT<span>.</span>Dashboard</h1>
  <div class="stat"><b id="s-calls">—</b><i>вызовов / сутки</i></div>
  <div class="stat"><b id="s-cost">—</b><i>потрачено всего</i></div>
  <div class="stat"><b id="s-bal">—</b><i>остаток DeepSeek</i></div>
  <div class="stat"><b id="s-err">—</b><i>ошибок</i></div>
  <div class="spacer"></div>
  <select id="proj"></select>
</header>

<nav>
  <button class="on" data-tab="feed">Лента</button>
  <button data-tab="run">Запуск</button>
  <button data-tab="roles">Роли и промпты</button>
  <button data-tab="ctx">Контекст проектов</button>
</nav>

<main>
  <section class="tab on" id="tab-feed">
    <div class="card" style="padding:0">
      <div class="row" style="color:var(--dim);font-weight:600;background:var(--panel2)">
        <span>время</span><span>роль</span><span>модель</span><span>задача</span>
        <span class="c">токены</span><span class="c">$</span>
      </div>
      <div class="feed" id="feed"></div>
    </div>
  </section>

  <section class="tab" id="tab-run">
    <div class="card">
      <div class="bar">
        <select id="run-role"></select>
        <label style="margin:0;text-transform:none">режим:</label>
        <select id="run-mode">
          <option value="run">один агент</option>
          <option value="council">совет (консультант ⇄ оппонент)</option>
        </select>
        <button id="run-go">Запустить</button>
        <span class="meta" id="run-meta"></span>
      </div>
      <label>Задача</label>
      <textarea id="run-task" rows="6" placeholder="Что сделать. Пиши полно: что, где, по каким правилам, что считать готовым."></textarea>
      <label>Дополнительные материалы (необязательно)</label>
      <textarea id="run-extra" rows="4" placeholder="Куски кода, ответы API, логи…"></textarea>
      <div class="out" id="run-out" hidden></div>
    </div>
  </section>

  <section class="tab" id="tab-roles">
    <div class="grid">
      <div class="list" id="role-list"></div>
      <div class="card">
        <div id="role-info" class="meta"></div>
        <label>Системный промпт роли</label>
        <textarea id="role-prompt" rows="22"></textarea>
        <div class="bar">
          <button id="role-save">Сохранить</button>
          <span class="meta">MCP-сервер перечитает файл сам — перезапуск не нужен.</span>
        </div>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-ctx">
    <div class="grid">
      <div class="list" id="note-list"></div>
      <div class="card">
        <div class="bar">
          <input id="note-name" placeholder="имя-заметки.md" style="flex:1">
          <button id="note-save">Сохранить</button>
        </div>
        <div class="meta">_core.md уходит в промпт каждого агента целиком — держи в нём стек, соглашения и цели.</div>
        <textarea id="note-text" rows="22"></textarea>
      </div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const api = async (u, o) => {
  const r = await fetch(u, o);
  if (!r.ok) throw new Error((await r.text()).slice(0, 300));
  return r.json();
};
let STATE = null, since = 0, curRole = null, curNote = null;

const money = v => '$' + (v || 0).toFixed(v && v < 0.01 ? 5 : 4);
const time = ts => new Date(ts * 1000).toLocaleTimeString('ru-RU');

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('on', t.id === 'tab-' + b.dataset.tab));
  if (b.dataset.tab === 'ctx') loadNotes();
});

function paintTotals(t, balance) {
  $('#s-calls').textContent = `${t.calls_24h} / ${t.calls}`;
  $('#s-cost').textContent = money(t.cost);
  $('#s-err').textContent = t.errors;
  if (balance !== undefined && balance !== null) $('#s-bal').textContent = '$' + balance.toFixed(2);
}

function paintFeed(evts) {
  const feed = $('#feed');
  for (const e of evts) {
    const d = document.createElement('div');
    d.className = 'row';
    if (e.event === 'call') {
      const free = !e.cost;
      d.innerHTML = `<span class="t">${time(e.ts)}</span>
        <span class="tag">${e.role || '—'}</span>
        <span>${e.model || ''}</span>
        <span class="task" title="${(e.task || '').replace(/"/g, '&quot;')}">${e.task || ''}</span>
        <span class="c">${e.tokens_in}→${e.tokens_out}</span>
        <span class="c ${free ? 'tag free' : ''}">${free ? '0' : e.cost.toFixed(4)}</span>`;
    } else if (e.event === 'error') {
      d.innerHTML = `<span class="t">${time(e.ts)}</span><span class="tag err">ошибка</span>
        <span>${e.model || ''}</span><span class="task" colspan="3">${e.error || ''}</span>
        <span></span><span></span>`;
    } else {
      d.innerHTML = `<span class="t">${time(e.ts)}</span><span class="tag">${e.event}</span>
        <span>${e.project || ''}</span>
        <span class="task">${e.topic || e.query || e.name || e.role || ''}</span>
        <span class="c"></span><span class="c">${e.cost ? e.cost.toFixed(4) : ''}</span>`;
    }
    feed.prepend(d);
    if (e.ts > since) since = e.ts + 0.000001;
  }
  while (feed.children.length > 300) feed.lastChild.remove();
}

async function poll() {
  try {
    const d = await api(`/api/events?since=${since}&limit=120`);
    paintFeed(d.events);
    paintTotals(d.totals);
  } catch (e) { /* дашборд не должен падать из-за одного промаха */ }
  setTimeout(poll, 2000);
}

function paintRoles() {
  $('#role-list').innerHTML = '';
  $('#run-role').innerHTML = '';
  for (const r of STATE.roles) {
    const d = document.createElement('div');
    d.innerHTML = `${r.name}<small>${r.model}${r.thinking ? ' · думает' : ''}</small>`;
    d.onclick = () => selectRole(r.name);
    d.dataset.role = r.name;
    $('#role-list').append(d);
    $('#run-role').append(new Option(`${r.name} — ${r.model}`, r.name));
  }
  selectRole(STATE.roles[0].name);
}

function selectRole(name) {
  curRole = STATE.roles.find(r => r.name === name);
  document.querySelectorAll('#role-list div').forEach(d =>
    d.classList.toggle('on', d.dataset.role === name));
  const m = STATE.models[curRole.model] || {};
  $('#role-info').textContent =
    `${curRole.description} · модель ${curRole.model} · ` +
    `${m.price_out ? '$' + m.price_out + ' за 1M выхода' : 'бесплатно (подписка)'} · ` +
    `параллелизм ${m.concurrency} · думанье ${curRole.thinking ? 'вкл' : 'выкл'}` +
    (curRole.fallback ? ` · резерв ${curRole.fallback}` : '');
  $('#role-prompt').value = curRole.prompt;
}

$('#role-save').onclick = async () => {
  await api('/api/prompt', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: curRole.name, prompt: $('#role-prompt').value })
  });
  curRole.prompt = $('#role-prompt').value;
  $('#role-save').textContent = 'Сохранено ✓';
  setTimeout(() => $('#role-save').textContent = 'Сохранить', 1500);
};

$('#run-go').onclick = async () => {
  const btn = $('#run-go'), out = $('#run-out');
  btn.disabled = true; btn.textContent = 'Работает…';
  out.hidden = false; out.textContent = '…';
  const body = {
    role: $('#run-role').value, task: $('#run-task').value,
    project: $('#proj').value, extra: $('#run-extra').value
  };
  try {
    if ($('#run-mode').value === 'council') {
      const d = await api('/api/council', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      out.textContent = d.transcript
        .map(t => `### ${t.speaker} (${t.model})\n${t.text}`).join('\n\n');
      $('#run-meta').textContent = `совет · ${d.transcript.length} реплик · ${money(d.cost)}`;
    } else {
      const d = await api('/api/run', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      out.textContent = d.text;
      $('#run-meta').textContent =
        `${d.model} · ${d.tokens_in}→${d.tokens_out} ток.` +
        (d.reasoning ? ` (${d.reasoning} размышления)` : '') +
        ` · ${money(d.cost)} · ${d.seconds}c`;
    }
  } catch (e) { out.textContent = 'Ошибка: ' + e.message; }
  btn.disabled = false; btn.textContent = 'Запустить';
};

async function loadNotes() {
  const d = await api('/api/context/' + $('#proj').value);
  const list = $('#note-list');
  list.innerHTML = '';
  const names = Object.keys(d.notes);
  if (!names.includes('_core.md')) names.unshift('_core.md');
  for (const n of names) {
    const el = document.createElement('div');
    el.innerHTML = `${n}<small>${(d.notes[n] || '').length} символов</small>`;
    el.onclick = () => {
      curNote = n;
      $('#note-name').value = n;
      $('#note-text').value = d.notes[n] || '';
      document.querySelectorAll('#note-list div').forEach(x =>
        x.classList.toggle('on', x === el));
    };
    list.append(el);
    if (n === (curNote || '_core.md')) el.click();
  }
}

$('#note-save').onclick = async () => {
  await api('/api/context', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      project: $('#proj').value, name: $('#note-name').value, text: $('#note-text').value
    })
  });
  curNote = $('#note-name').value;
  await loadNotes();
};

(async () => {
  STATE = await api('/api/state');
  for (const p of STATE.projects) $('#proj').append(new Option(p.title.split(' — ')[0], p.id));
  $('#proj').onchange = loadNotes;
  paintTotals(STATE.totals, STATE.balance);
  paintRoles();
  poll();
})();
</script>
</body>
</html>
